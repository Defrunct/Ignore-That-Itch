<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Options — Ignore That Itch</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded&icon_names=upload,cell_merge,download&display=block">
  <link rel="stylesheet" href="options.css">
  <script src="options.js" defer></script>
</head>

<body>
  <div class="title">Ignore That Itch</div>
  <div class="counter">
    <span data-i18n="optionsCounterLabel"></span>
    <span id="counter-number">0</span>
  </div>
  <div class="controls">
    <a id="btn-import" data-i18n-title="optionsTooltipImport">
      <span class="icon">upload</span>
      <span data-i18n="optionsButtonImport"></span>
    </a>
    <a id="btn-merge" data-i18n-title="optionsTooltipMerge">
      <span class="icon">cell_merge</span>
      <span data-i18n="optionsButtonMerge"></span>
    </a>
    <a id="btn-export" data-i18n-title="optionsTooltipExport">
      <span class="icon">download</span>
      <span data-i18n="optionsButtonExport"></span>
    </a>
  </div>
</body>

</html>
